<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Log — Voice Recorder</title>
<meta name="theme-color" content="#F6F5EF">
<link rel="icon" href="icons/game-log.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Sora:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F5EF; --ink:#22242A; --blue:#2B5BD7; --yellow:#F2B92E; --red:#E4572E; --card:#fff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Sora',system-ui,sans-serif;color:var(--ink);
    background-color:var(--paper);
    background-image:radial-gradient(rgba(34,36,42,.12) 1.5px, transparent 1.5px);
    background-size:26px 26px;
    line-height:1.55;font-size:16px;
    padding:20px 16px 80px;
  }
  .wrap{max-width:680px;margin:0 auto}
  h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:1.6rem;letter-spacing:-.01em}
  .kicker{font-family:'IBM Plex Mono',monospace;font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;opacity:.7;margin-bottom:4px}
  header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:22px}
  .iconbtn{
    border:2px solid var(--ink);border-radius:10px;background:var(--card);
    font-family:'IBM Plex Mono',monospace;font-size:.78rem;font-weight:500;
    padding:8px 12px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);color:var(--ink);
  }
  .iconbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}

  .panel{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:16px;box-shadow:4px 4px 0 var(--ink);margin-bottom:16px}
  label{font-family:'IBM Plex Mono',monospace;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:6px;opacity:.8}
  input[type=text],input[type=password],textarea{
    width:100%;border:2px solid var(--ink);border-radius:10px;padding:10px 12px;
    font-family:'Sora',sans-serif;font-size:.95rem;background:#fff;color:var(--ink);
  }
  textarea{min-height:84px;resize:vertical}
  input:focus,textarea:focus,button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

  .section{margin-bottom:14px}
  .sec-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
  .sec-top label{margin:0}
  .mic{
    border:2px solid var(--ink);border-radius:999px;background:var(--card);cursor:pointer;
    font-family:'IBM Plex Mono',monospace;font-size:.72rem;font-weight:500;color:var(--ink);
    padding:6px 14px;box-shadow:2px 2px 0 var(--ink);display:flex;align-items:center;gap:6px;white-space:nowrap;
  }
  .mic .dot{width:9px;height:9px;border-radius:50%;background:#bbb;flex:none}
  .mic.live{background:var(--red);color:#fff}
  .mic.live .dot{background:#fff;animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.3}}
  @media (prefers-reduced-motion: reduce){.mic.live .dot{animation:none}}

  .hint{font-family:'IBM Plex Mono',monospace;font-size:.72rem;opacity:.6;margin-top:4px}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row > *{flex:1;min-width:180px}

  .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
  .btn{
    flex:1;min-width:160px;border:2px solid var(--ink);border-radius:12px;padding:14px 18px;cursor:pointer;
    font-family:'IBM Plex Mono',monospace;font-size:.9rem;font-weight:500;
    background:var(--card);color:var(--ink);box-shadow:4px 4px 0 var(--ink);
  }
  .btn.primary{background:var(--blue);color:#fff}
  .btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  #status{
    font-family:'IBM Plex Mono',monospace;font-size:.8rem;margin-top:14px;padding:10px 12px;
    border:2px solid var(--ink);border-radius:10px;display:none;background:var(--card);
  }
  #status.ok{display:block;background:#E7F3E4}
  #status.err{display:block;background:#FBE7E1}
  #status.busy{display:block;background:#FFF6DE}

  #settings{display:none}
  #settings.open{display:block}
  .small{font-size:.82rem;opacity:.8;margin-top:8px}
  .small a{color:var(--blue)}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <p class="kicker">Analysis library · voice log</p>
      <h1>🎲 Game Log</h1>
    </div>
    <div style="display:flex;gap:8px">
      <a class="iconbtn" href="projects/" style="text-decoration:none;display:inline-block">← Projects</a>
      <button class="iconbtn" id="settingsBtn" type="button">⚙ Setup</button>
    </div>
  </header>

  <!-- ============ SETTINGS ============ -->
  <div class="panel" id="settings">
    <div class="section">
      <label for="workerUrl">Relay (Cloudflare Worker) URL</label>
      <input type="text" id="workerUrl" placeholder="https://your-worker.your-name.workers.dev">
    </div>
    <div class="section">
      <label for="notionToken">Notion integration secret</label>
      <input type="password" id="notionToken" placeholder="ntn_… or secret_…">
      <p class="hint">Stored only on this device. Never put it in any file you upload or host.</p>
    </div>
    <div class="section">
      <label for="dbId">Notion database ID</label>
      <input type="text" id="dbId" placeholder="32-character ID from the database URL">
    </div>
    <div class="actions">
      <button class="btn" id="saveSettings" type="button">Save settings</button>
      <button class="btn" id="testSettings" type="button">Test connection</button>
    </div>
    <p class="small">Setup guide is in <strong>notion-setup.md</strong> that came with this app.</p>
  </div>

  <!-- ============ LOG FORM ============ -->
  <div class="panel">
    <div class="row">
      <div class="section">
        <div class="sec-top">
          <label for="f_game">Game</label>
          <button class="mic" data-target="f_game" type="button"><span class="dot"></span>dictate</button>
        </div>
        <input type="text" id="f_game" placeholder="Title of the game">
      </div>
      <div class="section">
        <div class="sec-top">
          <label for="f_meta">Players / weight / plays</label>
          <button class="mic" data-target="f_meta" type="button"><span class="dot"></span>dictate</button>
        </div>
        <input type="text" id="f_meta" placeholder="e.g. 3p · medium · 1st play">
      </div>
    </div>

    <div class="section">
      <div class="sec-top">
        <label for="f_loop">1 · Core loop (one sentence)</label>
        <button class="mic" data-target="f_loop" type="button"><span class="dot"></span>dictate</button>
      </div>
      <textarea id="f_loop" placeholder="What do players actually do, over and over?"></textarea>
    </div>

    <div class="section">
      <div class="sec-top">
        <label for="f_feel">2 · Intended feel &amp; decisions</label>
        <button class="mic" data-target="f_feel" type="button"><span class="dot"></span>dictate</button>
      </div>
      <textarea id="f_feel" placeholder="What does the game want players to feel and decide?"></textarea>
    </div>

    <div class="section">
      <div class="sec-top">
        <label for="f_mech">3 · Load-bearing vs decorative mechanisms</label>
        <button class="mic" data-target="f_mech" type="button"><span class="dot"></span>dictate</button>
      </div>
      <textarea id="f_mech" placeholder="What carries the game, what is ornament?"></textarea>
    </div>

    <div class="section">
      <div class="sec-top">
        <label for="f_creak">4 · Where it creaks</label>
        <button class="mic" data-target="f_creak" type="button"><span class="dot"></span>dictate</button>
      </div>
      <textarea id="f_creak" placeholder="Pacing, balance, rules ambiguity, component friction…"></textarea>
    </div>

    <div class="section">
      <div class="sec-top">
        <label for="f_fix">5 · Minimal change I'd test (+ its cost)</label>
        <button class="mic" data-target="f_fix" type="button"><span class="dot"></span>dictate</button>
      </div>
      <textarea id="f_fix" placeholder="Smallest fix worth testing, and what it costs in components/complexity"></textarea>
    </div>

    <div class="actions">
      <button class="btn primary" id="saveNotion" type="button">Save to Notion →</button>
      <button class="btn" id="copyMd" type="button">Copy as text</button>
      <button class="btn" id="clearForm" type="button">Clear</button>
    </div>
    <div id="status" role="status"></div>
  </div>

</div>

<script>
(function(){
  'use strict';

  // ---------- tiny storage helper (survives Claude preview where localStorage is blocked) ----------
  const mem = {};
  const store = {
    get(k){ try{ return localStorage.getItem(k) ?? mem[k] ?? ''; }catch(e){ return mem[k] ?? ''; } },
    set(k,v){ mem[k]=v; try{ localStorage.setItem(k,v); }catch(e){} }
  };

  // ---------- settings ----------
  const $ = id => document.getElementById(id);
  const settingsPanel = $('settings');
  $('settingsBtn').addEventListener('click', () => settingsPanel.classList.toggle('open'));

  const KEYS = ['workerUrl','notionToken','dbId'];
  KEYS.forEach(k => { $(k).value = store.get('gamelog_'+k); });
  if (!store.get('gamelog_workerUrl')) settingsPanel.classList.add('open');

  $('saveSettings').addEventListener('click', () => {
    KEYS.forEach(k => store.set('gamelog_'+k, $(k).value.trim()));
    setStatus('ok', 'Settings saved on this device.');
  });

  // ---------- status ----------
  const statusEl = $('status');
  function setStatus(kind, msg){
    statusEl.className = kind;
    statusEl.textContent = msg;
  }

  // ---------- speech recognition ----------
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let activeMic = null, recognition = null, baseText = '';

  function stopMic(){
    if (recognition){ recognition.onend = null; recognition.stop(); recognition = null; }
    if (activeMic){ activeMic.classList.remove('live'); activeMic.querySelector('.dot').nextSibling.textContent = 'dictate'; }
    activeMic = null;
  }

  document.querySelectorAll('.mic').forEach(btn => {
    btn.addEventListener('click', () => {
      if (!SR){
        setStatus('err','Speech recognition is not available in this browser. Use Chrome (Android/Windows) or Edge.');
        return;
      }
      // toggle off if this mic is live
      if (activeMic === btn){ stopMic(); return; }
      stopMic();

      const field = $(btn.dataset.target);
      baseText = field.value ? field.value.replace(/\s+$/,'') + ' ' : '';

      const IS_ANDROID = /Android/i.test(navigator.userAgent);

      recognition = new SR();
      recognition.lang = 'en-US';
      // Android's recognizer misbehaves in continuous mode (overlapping,
      // repeated results). There we run ONE utterance per session and
      // silently restart in onend — nothing accumulates, nothing duplicates.
      recognition.continuous = !IS_ANDROID;
      recognition.interimResults = true;

      let committed = '';      // text finalized across the whole dictation
      let sessionUtter = '';   // live hypothesis of the current utterance (Android)

      function render(extra){
        field.value = (baseText + committed + (extra || ''))
          .replace(/\s+/g,' ').trimStart();
      }
      function commitUtterance(){
        const t = sessionUtter.trim();
        sessionUtter = '';
        if (t) committed += t + ' ';
      }

      recognition.onresult = (e) => {
        if (IS_ANDROID){
          // Fresh session per utterance: the latest hypothesis REPLACES the
          // previous one instead of being appended — duplication impossible.
          let utter = '';
          for (let i = 0; i < e.results.length; i++) utter += e.results[i][0].transcript + ' ';
          sessionUtter = utter;
          if (e.results[e.results.length - 1].isFinal){
            commitUtterance();
            render();
          } else {
            render(sessionUtter);
          }
        } else {
          // Desktop: continuous mode, process only new results
          let interim = '';
          for (let i = e.resultIndex; i < e.results.length; i++){
            const t = e.results[i][0].transcript.trim();
            if (!t) continue;
            if (e.results[i].isFinal) committed += t + ' ';
            else interim += t + ' ';
          }
          render(interim);
        }
      };
      recognition.onerror = (e) => {
        if (e.error === 'no-speech' || e.error === 'aborted') return; // onend handles restart
        stopMic();
        if (e.error === 'not-allowed') setStatus('err','Microphone permission denied. Allow the mic for this page in your browser settings.');
        else setStatus('err','Speech error: ' + e.error);
      };
      // Restart silently while the mic is toggled on. If a session ended
      // with unfinalized text (some recognizers never mark isFinal), keep it.
      recognition.onend = () => {
        if (activeMic === btn){
          if (sessionUtter){ commitUtterance(); render(); }
          try{ recognition.start(); }
          catch(err){ stopMic(); }
        }
      };

      recognition.start();
      activeMic = btn;
      btn.classList.add('live');
      btn.querySelector('.dot').nextSibling.textContent = 'stop';
      setStatus('busy','Listening… tap "stop" on the same field when done.');
    });
  });

  // ---------- build entry ----------
  const SECTIONS = [
    ['1 · Core loop','f_loop'],
    ['2 · Intended feel & decisions','f_feel'],
    ['3 · Load-bearing vs decorative','f_mech'],
    ['4 · Where it creaks','f_creak'],
    ['5 · Minimal change to test','f_fix'],
  ];

  function entryAsText(){
    const lines = [];
    lines.push('# ' + ($('f_game').value.trim() || 'Untitled game'));
    if ($('f_meta').value.trim()) lines.push('_' + $('f_meta').value.trim() + '_');
    SECTIONS.forEach(([title,id]) => {
      const v = $(id).value.trim();
      if (v){ lines.push('', '## ' + title, v); }
    });
    return lines.join('\n');
  }

  $('copyMd').addEventListener('click', async () => {
    try{
      await navigator.clipboard.writeText(entryAsText());
      setStatus('ok','Copied. Paste it anywhere — including straight into Notion.');
    }catch(e){ setStatus('err','Copy failed — select and copy manually.'); }
  });

  $('clearForm').addEventListener('click', () => {
    stopMic();
    document.querySelectorAll('input[type=text], textarea').forEach(el => {
      if (!KEYS.includes(el.id)) el.value = '';
    });
    setStatus('ok','Cleared.');
  });

  // ---------- Notion save (via relay worker) ----------
  function chunk(text, size){
    const out = [];
    for (let i = 0; i < text.length; i += size) out.push(text.slice(i, i + size));
    return out;
  }

  function notionBlocks(){
    const blocks = [];
    const meta = $('f_meta').value.trim();
    if (meta) blocks.push({ object:'block', type:'paragraph',
      paragraph:{ rich_text:[{ type:'text', text:{ content: meta }, annotations:{ italic:true } }] } });
    SECTIONS.forEach(([title,id]) => {
      const v = $(id).value.trim();
      if (!v) return;
      blocks.push({ object:'block', type:'heading_3',
        heading_3:{ rich_text:[{ type:'text', text:{ content: title } }] } });
      chunk(v, 1900).forEach(part => {
        blocks.push({ object:'block', type:'paragraph',
          paragraph:{ rich_text:[{ type:'text', text:{ content: part } }] } });
      });
    });
    return blocks;
  }

  async function notionFetch(path, method, body){
    const worker = store.get('gamelog_workerUrl').replace(/\/$/,'');
    const token  = store.get('gamelog_notionToken');
    if (!worker || !token) throw new Error('Fill in the relay URL and Notion secret under ⚙ Setup.');
    const res = await fetch(worker + path, {
      method,
      headers:{
        'Authorization':'Bearer ' + token,
        'Notion-Version':'2022-06-28',
        'Content-Type':'application/json'
      },
      body: body ? JSON.stringify(body) : undefined
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.message || ('Notion error ' + res.status));
    return data;
  }

  $('testSettings').addEventListener('click', async () => {
    setStatus('busy','Testing connection…');
    try{
      const dbId = store.get('gamelog_dbId') || $('dbId').value.trim();
      await notionFetch('/v1/databases/' + dbId, 'GET');
      setStatus('ok','Connected! Notion can hear you.');
    }catch(e){ setStatus('err', e.message); }
  });

  $('saveNotion').addEventListener('click', async () => {
    stopMic();
    const game = $('f_game').value.trim();
    if (!game){ setStatus('err','Give the entry a game title first.'); return; }
    const btn = $('saveNotion');
    btn.disabled = true;
    setStatus('busy','Saving to Notion…');
    try{
      await notionFetch('/v1/pages','POST',{
        parent:{ database_id: store.get('gamelog_dbId') },
        properties:{ Name:{ title:[{ text:{ content: game } }] } },
        children: notionBlocks()
      });
      setStatus('ok','Saved! "' + game + '" is now in your Notion library.');
    }catch(e){
      setStatus('err', e.message + ' — your text is still here; use "Copy as text" as backup.');
    }finally{
      btn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
